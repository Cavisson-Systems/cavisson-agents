global:
  namespace: cavisson

namespace: cavisson

cmon:
  enabled: true
  image:
    repository: cavissonsystem/cmon_nf_agent
    tag: "4.16.0.68"
    pullPolicy: Always

  controller: "64.71.137.183:4472"
  tier: "DirecTV-dpdui-dev"
  ndcCommProtocol: "WSS"
  clusterName: "dpdui-eks-uswest2-dev"
  jvmOpts: "-Xms1000m -Xmx1500m"
  monAgentOpts: "-F 0 -m 300 -d 5"
  verifyServerCert: "0"
  verifyHostName: "0"
  clientKey: "your-client-privatekey.key"
  clientCert: "your-client-cert.cer"
  serverCaCert: "your-ca-bundle.crt"


webhook:
  enabled: true
  image:
    repository: cavissonsystem/nd_webhook_injector
    tag: 4.16.0.B67
    pullPolicy: Always

  instrumentationTemplates:
    - name: nodejs-default
      injectionRules:
        technology: nodejs
        image: cavissonsystem/node.js-agent:4.16.0.B67  # TODO: replace with cavissonsystem nodejs agent image
        TierNameSource: auto
        env:
          - name: CAV_APP_AGENT_AGENTLOGGINGMODE
            value: "ALL"
          - name: CAV_APP_AGENT_NDCHOST
            value: "64.71.137.183"
          - name: CAV_APP_AGENT_NDCPORT
            value: "4472"
          - name: CAV_APP_AGENT_NDC_COMM_PROTOCOL
            value: "WSS"
