global:
  namespace: cavisson

namespace: cavisson

cmon:
  enabled: true
  tls-enabled: false
  image:
    tag: "4.16.0.69" # replace the tag version 

  controller: "directv.cav-test.com:443" #add your controller host
  clusterName: "dpdui-dev"
  verifyServerCert: "0"
  verifyHostName: "0"
  clientKey: "your-client-privatekey.key"
  clientCert: "your-client-cert.cer"
  serverCaCert: "your-ca-bundle.crt"
  
cavproxy:
  enabled: false
  tls-enabled: false
  image:
    repository: cavissonsystem/cavndproxy-alpine
    tag: 4.16.0.B62
    pullPolicy: Always

  ndhome: "/opt/cavisson/netdiagnostics"
  ldLibraryPath: "/usr/lib/x86_64-linux-gnu"
  ndcHost: "directv.cav-test.com"  # add your ndc host ex : ndcHost: "netcloud4-15-u24.cav-test.com"
  ndcPort: "443"                       # add your ndc port ex : ndcPort: "443"
  ndcCommProtocol: "WSS"
  loggingMode: "2"
  verifyServerCert: "1"
  verifyHostName: "0"
  acceptSelfSignedCert: "0"
  acceptExpiredCert: "0"
  acceptRevokedCert: "0"
  serverCaCert: "your-ca-bundle.crt"
  clientCert: "your-client-cert.cer"
  clientKey: "your-client-privatekey.key"
  tlsSecretName: tls-secret

webhook:
  enabled: true
  image:
    repository: cavissonsystem/nd_webhook_injector
    tag: 4.16.0.B69
    pullPolicy: IfNotPresent

    instrumentationTemplates:
    - name: nodejs-default
      injectionRules:
        technology: nodejs
        image: cavissonsystem/node.js-agent:4.16.0.B67  # TODO: replace with cavissonsystem nodejs agent image
        TierNameSource: auto
        env:
          - name: CAV_APP_AGENT_AGENTLOGGINGMODE
            value: "ALL"
          - name: CAV_APP_AGENT_NDCHOST
            value: "directv.cav-test.com"
          - name: CAV_APP_AGENT_NDCPORT
            value: "443"
          - name: CAV_APP_AGENT_NDC_COMM_PROTOCOL
            value: "WSS"
# Cluster agent 
clusterAgent:
  enabled: true
  image:
    repository: cavissonsystem/cluster-agent
    tag: 4.16.0.B69

  # KubeOpt backend - prefer https
  kubeoptUrl: "http://directv.cav-test.com:8282"
  clusterName: "dpdui-dev"
