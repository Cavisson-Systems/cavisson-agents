enabled: true
tls-enabled: false

image:
  repository: cavissonsystem/cmon_nf_agent
  tag: "4.16.0.69"
  imagePullPolicy: IfNotPresent

port: 7891

resources:
  limits:
    cpu: "500m"
    memory: "750Mi"
  requests:
    cpu: "250m"
    memory: "550Mi"

tlsSecretName: tls-secret

jvmOpts: "-Xms256m -Xmx512m"
monAgentOpts: " "

